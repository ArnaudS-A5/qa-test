<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>imbrication</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; color: #1a1a1a; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .qa-desc { border-left: 4px solid #2563eb; background: #f1f5f9; padding: 10px 14px; margin: 8px 0 18px; max-width: 720px; border-radius: 4px; }
    .qa-sub { margin: 0 0 6px; font-size: 15px; color: #334155; }
    .qa-val { font-weight: 700; color: #15803d; }
    code { background: #e2e8f0; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
    .branche, .branche div { border-left: 2px solid #94a3b8; padding: 2px 0 2px 10px; margin: 2px 0; }
    .leurre { color: #b91c1c; }
  </style>
</head>
<body>
  <!--
    Fixture imbrication (T79 à T81) : websync/within/ImbricationWithinTest.
    Deux branches de même structure : #branche-x > .niveau-2 > .niveau-3 > .niveau-4 > .niveau-5 > .cible + .action.
    Dans #branche-b, un LEURRE (.niveau-4 > .niveau-5 > .cible) est placé directement sous .niveau-2, AVANT
    .niveau-3 dans l'ordre du DOM : une vue within qui « oublierait » un niveau tomberait sur lui, ou sur la
    branche A. Seule la chaîne complète des 5 within atteint "cible B".
  -->
  <h1>imbrication — within sur 5 niveaux</h1>
  <div class="qa-desc">
    <p class="qa-sub">Cible : <code>#branche-b</code> › <code>.niveau-2</code> › <code>.niveau-3</code> › <code>.niveau-4</code> › <code>.niveau-5</code> › <code>.cible</code> / <code>.action</code>.</p>
  </div>

  <div id="branche-a" class="branche">branche A
    <div class="niveau-2"><div class="niveau-3"><div class="niveau-4"><div class="niveau-5">
      <span class="cible">cible A</span> <button class="action" type="button" onclick="agir('A')">agir A</button>
    </div></div></div></div>
  </div>

  <div id="branche-b" class="branche">branche B
    <div class="niveau-2">
      <div class="niveau-4 leurre"><div class="niveau-5">
        <span class="cible">leurre B</span> <button class="action" type="button" onclick="agir('leurre B')">agir leurre</button>
      </div></div>
      <div class="niveau-3"><div class="niveau-4"><div class="niveau-5">
        <span class="cible">cible B</span> <button class="action" type="button" onclick="agir('B')">agir B</button>
      </div></div></div>
    </div>
  </div>

  <p>Dernière action : <span class="qa-val" id="statut">aucune</span></p>
  <script>
    function agir(qui) { document.getElementById('statut').textContent = qui; }
  </script>
</body>
</html>
