<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>disabled</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; color: #1a1a1a; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .qa-desc { border-left: 4px solid #2563eb; background: #f1f5f9; padding: 10px 14px; margin: 8px 0 18px; max-width: 820px; border-radius: 4px; }
    .qa-sub { margin: 0 0 6px; font-size: 15px; color: #334155; }
    .qa-wait { margin: 4px 0; font-size: 14px; color: #0f172a; }
    .qa-val { font-weight: 700; color: #b91c1c; }
    .qa-expect { margin: 6px 0 0; font-size: 13px; color: #475569; }
    code { background: #e2e8f0; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
    #target { margin-top: 10px; }
  </style>
</head>
<body>
  <!--
    Fixture diagnostic [DISABLED] (T8, websync/diagnostic/DiagnosticCodeTest).
    #target est présent, visible, mais disabled.
    Option : ?enableAfter=N (ms) le réactive après N ms (waitUntilEnabled).
  -->
  <h1>disabled — élément présent mais désactivé</h1>
  <div class="qa-desc">
    <p class="qa-sub">Le bouton <code>#target</code> est <b>présent et visible</b> mais porte l'attribut <code>disabled</code>.</p>
    <p class="qa-wait">Ce qu'on attend : <span class="qa-val" id="mode-txt">…</span></p>
    <p class="qa-expect">T8 : sans réactivation, le diagnostic au timeout doit contenir le code <code>[DISABLED]</code>. Avec <code>?enableAfter=N</code>, on teste plutôt <code>waitUntilEnabled</code>.</p>
  </div>
  <button id="target" type="button" disabled>target</button>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var enableAfter = params.get('enableAfter');
      if (enableAfter !== null) {
        window.setTimeout(function () {
          var el = document.getElementById('target');
          if (el) { el.removeAttribute('disabled'); }
        }, parseInt(enableAfter, 10));
      }
    })();
  </script>
  <script>
    // Affichage descriptif uniquement — n'affecte pas la mécanique ci-dessus.
    (function () {
      var enableAfter = new URLSearchParams(window.location.search).get('enableAfter');
      var txt;
      if (enableAfter === null) {
        txt = 'le bouton reste disabled (jamais réactivé)';
      } else {
        var n = Number.parseInt(enableAfter, 10);
        var s = (n / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 3 });
        txt = 'réactivation (removeAttribute disabled) après ' + n + ' ms (' + s + ' s)';
      }
      document.getElementById('mode-txt').textContent = txt;
    })();
  </script>
</body>
</html>
