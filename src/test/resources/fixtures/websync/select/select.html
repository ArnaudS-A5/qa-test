<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>select</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; color: #1a1a1a; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .qa-desc { border-left: 4px solid #2563eb; background: #f1f5f9; padding: 10px 14px; margin: 8px 0 18px; max-width: 720px; border-radius: 4px; }
    .qa-sub { margin: 0 0 6px; font-size: 15px; color: #334155; }
    .qa-expect { margin: 6px 0 0; font-size: 13px; color: #475569; }
    code { background: #e2e8f0; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
    label { display: inline-block; margin: 6px 0; vertical-align: top; }
  </style>
</head>
<body>
  <!--
    Fixture listes déroulantes (T33 à T36) : websync/select/SelectListTest.
    #simple : liste simple (1re option sélectionnée par défaut par le navigateur).
    #multiple : liste à sélection multiple, AUCUNE option sélectionnée au chargement.
  -->
  <h1>select — listes déroulantes</h1>
  <div class="qa-desc">
    <p class="qa-sub">Sélection, désélection et lectures sur des <code>&lt;select&gt;</code>.</p>
    <p class="qa-expect">
      <code>#simple</code> : Option A/B/C (valeurs a/b/c) ·
      <code>#multiple</code> (multiple) : Rouge/Vert/Bleu/Jaune (valeurs r/v/b/j), rien de sélectionné.
    </p>
  </div>
  <label>Liste simple :
    <select id="simple" name="simple">
      <option value="a">Option A</option>
      <option value="b">Option B</option>
      <option value="c">Option C</option>
    </select>
  </label>
  <br>
  <label>Liste multiple :
    <select id="multiple" name="multiple" multiple size="4">
      <option value="r">Rouge</option>
      <option value="v">Vert</option>
      <option value="b">Bleu</option>
      <option value="j">Jaune</option>
    </select>
  </label>
</body>
</html>
