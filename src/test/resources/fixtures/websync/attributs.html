<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>attributs</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; color: #1a1a1a; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .qa-desc { border-left: 4px solid #2563eb; background: #f1f5f9; padding: 10px 14px; margin: 8px 0 18px; max-width: 420px; border-radius: 4px; }
    .qa-sub { margin: 0 0 6px; font-size: 15px; color: #334155; }
    .qa-expect { margin: 6px 0 0; font-size: 13px; color: #475569; }
    code { background: #e2e8f0; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
    .colonne { max-width: 420px; }
    .colonne > * { margin: 8px 0; }
    #alerte { color: rgb(200, 30, 30); }
    #boite { position: absolute; left: 500px; top: 150px; width: 150px; height: 40px; background: #0f766e; }
  </style>
</head>
<body>
  <!--
    Fixture lectures DOM (T37 à T41) : websync/lecture/LecturesDomTest.
    Le contenu tient dans une colonne de 420 px à gauche ; #boite est positionnée en absolu à droite
    (500,150), 150x40, sans bordure ni marge : sa géométrie est exacte et ne recouvre rien.
    Les textes comparés par les tests sont sans accent (comparaison d'octets indépendante de l'encodage).
  -->
  <h1>attributs — lectures DOM</h1>
  <div class="qa-desc">
    <p class="qa-sub">Texte, attributs/propriétés, style, ARIA et géométrie.</p>
    <p class="qa-expect"><code>#mixte</code> · <code>#champ</code> · <code>#alerte</code> · <code>#fermer</code> · <code>#navigation</code> · <code>#email</code> · <code>#boite</code></p>
  </div>
  <div class="colonne">
    <p id="mixte">Texte visible<span style="display:none"> et masque</span></p>
    <p><label>Champ : <input id="champ" type="text" value="initial"></label></p>
    <p id="alerte" class="alerte important">Alerte</p>
    <p><button id="fermer" type="button" aria-label="Fermer la fenetre">X</button></p>
    <div id="navigation" role="navigation">Menu</div>
    <p><label for="email">Adresse e-mail</label> <input id="email" type="email"></p>
  </div>
  <div id="boite"></div>
</body>
</html>
