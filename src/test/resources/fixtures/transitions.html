<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>transitions</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; color: #1a1a1a; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .qa-desc { border-left: 4px solid #2563eb; background: #f1f5f9; padding: 10px 14px; margin: 8px 0 18px; max-width: 720px; border-radius: 4px; }
    .qa-sub { margin: 0 0 6px; font-size: 15px; color: #334155; }
    .qa-wait { margin: 4px 0; font-size: 14px; color: #0f172a; }
    .qa-val { font-weight: 700; color: #15803d; }
    code { background: #e2e8f0; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
    #zone { margin: 12px 0; min-height: 32px; }
  </style>
</head>
<body>
  <!--
    Fixture transitions minutées (T49, T59 à T70, T78) : websync/assertion, websync/wait, config/polling
    (via support/Transitions).
    Paramètres : ?scenario=<nom>&delai=<ms>. #cible est un bouton dont le clic écrit "clicked" dans #statut.
      apparition         : #cible inséré visible après delai
      apparition-cachee  : #cible inséré en display:none après delai (présent, jamais visible)
      activation         : #cible visible et disabled dès le chargement, activé après delai
      desactivation      : #cible visible et actif dès le chargement, désactivé après delai
      disparition        : #cible visible dès le chargement, retiré du DOM après delai
    Le minuteur démarre au chargement de la page.
  -->
  <h1>transitions — changements d'état minutés</h1>
  <div class="qa-desc">
    <p class="qa-sub">Un seul élément <code>#cible</code>, qui change d'état après <code>?delai=N</code> ms selon <code>?scenario=</code>.</p>
    <p class="qa-wait">Scénario : <span class="qa-val" id="scenario-txt">…</span></p>
  </div>
  <div id="zone"></div>
  <p>Statut : <span class="qa-val" id="statut">aucun clic</span></p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var scenario = params.get('scenario');
      var delai = parseInt(params.get('delai') || '0', 10);
      var zone = document.getElementById('zone');

      function creerCible(cache) {
        var bouton = document.createElement('button');
        bouton.id = 'cible';
        bouton.type = 'button';
        bouton.textContent = 'cible';
        bouton.onclick = function () { document.getElementById('statut').textContent = 'clicked'; };
        if (cache) { bouton.style.display = 'none'; }
        zone.appendChild(bouton);
        return bouton;
      }

      var cible;
      switch (scenario) {
        case 'apparition':
          window.setTimeout(function () { creerCible(false); }, delai);
          break;
        case 'apparition-cachee':
          window.setTimeout(function () { creerCible(true); }, delai);
          break;
        case 'activation':
          cible = creerCible(false);
          cible.disabled = true;
          window.setTimeout(function () { cible.disabled = false; }, delai);
          break;
        case 'desactivation':
          cible = creerCible(false);
          window.setTimeout(function () { cible.disabled = true; }, delai);
          break;
        case 'disparition':
          cible = creerCible(false);
          window.setTimeout(function () { cible.remove(); }, delai);
          break;
        default:
          scenario = 'INCONNU (' + scenario + ') : aucune transition';
      }
      document.getElementById('scenario-txt').textContent = scenario + ' après ' + delai + ' ms';
    })();
  </script>
</body>
</html>
