# ============================================================================
# Configuration Serenity du projet de tests qa-test.
# ============================================================================
# Serenity utilise Selenium Manager (embarqué dans Selenium 4.x, fourni par le
# socle) pour provisionner automatiquement le driver Chrome : aucun binaire de
# driver à installer manuellement.

# Environnement (clé Serenity) : sert de {ENV} dans le nommage des artefacts KO__.
# Surchargé en ligne de commande via -Denvironment=... (précédence -D, cf. T24).
environment = qatest

webdriver {
  driver = chrome
  # Provisionnement automatique du driver (Selenium Manager).
  autodownload = true
  # Chrome sans interface (CI + exécution locale rapide).
  capabilities {
    "goog:chromeOptions" {
      args = [
        #"--headless=new",
        "--no-sandbox",
        "--disable-gpu",
        "--disable-dev-shm-usage",
        "--window-size=1920,1080"
      ]
    }
  }
  # Implicit wait natif = filet aux appels Selenium bruts (L1/L2). Le socle le
  # neutralise à 0 pendant son polling puis le restaure (les attentes ne
  # s'additionnent jamais — point clé T4/L6).
  timeouts {
    implicitlywait = 3000
  }
}

# Stratégie de chargement de page (prérequis prompt).
serenity {
  driver.page.load.strategy = normal
  take.screenshots = FOR_FAILURES
  # Sortie console native de Serenity : déroulé des steps lisible (valeurs
  # substituées + Secret masqué), en couleurs. Remplace le flot de DEBUG interne.
  logging = VERBOSE
  console.colors = true
}

# --------------------------------------------------------------------------
# Clés du socle qa-socle.
# --------------------------------------------------------------------------
qa {
  # Soft-assert : false = échec à la 1re assertion (défaut). Passer à true pour T17.
  assertions.soft = false
  failure {
    artefacts {
      enabled = true                 # mettre à false pour désactiver sans toucher au code
      outputDir = "target/qa-results"
      dumpHtml = true
    }
  }
  # Reporting AUTO hors périmètre : désactivé.
  reporting.enabled = false
}

# URL de base par environnement. `{ENV}` du nommage KO__ provient de la propriété
# Serenity `environment`. `default` fournit les valeurs héritées par tous les environnements.
environments {
  default {
    webdriver.base.url = "https://the-internet.herokuapp.com"
  }
}
