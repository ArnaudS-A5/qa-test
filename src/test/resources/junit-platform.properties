# Parallélisme JUnit 5.
# Infra activée, mais TOUT reste en same_thread par défaut → la suite normale (ex. LoginTest)
# n'est pas impactée. Seules les classes/méthodes annotées @Execution(CONCURRENT) tournent en
# parallèle — ici RawDomProducerTest, pour valider le pont ThreadLocal du socle (point 3).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
